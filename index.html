<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMD SPARK</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0b1120;
            display: flex;
            flex-direction: column;
            color: #e2e8f0;
            overflow: hidden;
        }
        /* ✅ کمپیکٹ ہیڈر */
        .header {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            padding: 4px 8px;
            border-bottom: 2px solid #ff9f43;
            flex-shrink: 0;
            max-height: 80px;
        }
        .title { font-size: 1rem; font-weight: 800; color: #fff; text-align: center; line-height: 1.2; }
        .dev-info { font-size: 0.6rem; color: #ff9f43; direction: ltr; text-align: center; line-height: 1.2; }
        .repo-link { display: block; text-align: center; color: #94a3b8; text-decoration: none; font-size: 0.65rem; direction: ltr; line-height: 1.2; }
        .repo-link:hover { color: #ff9f43; }
        .status-bar { display: flex; justify-content: center; gap: 12px; background: #0f172a; padding: 3px 6px; border-radius: 4px; font-family: monospace; font-size: 0.7rem; margin-top: 2px; }
        .status-item { text-align: center; }
        .status-label { display: block; font-size: 0.55rem; color: #94a3b8; }
        .status-value { font-weight: bold; color: #10b981; font-size: 0.75rem; }
        .status-value.off { color: #ef4444; }
        .key-bar { display: flex; justify-content: space-between; background: #0a0f1a; padding: 3px 6px; border-radius: 4px; font-size: 0.6rem; margin-top: 3px; font-family: monospace; }
        .key-val { color: #00e676; }
        .audit-val { color: #ffb300; }

        /* ✅ چیٹ ایریا */
        .chat-area { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: #0b1120; min-height: 0; }
        .msg { max-width: 85%; padding: 6px 10px; border-radius: 10px; font-size: 0.85rem; line-height: 1.3; word-wrap: break-word; }
        .msg.bot { background: #1e293b; color: #f1f5f9; align-self: flex-start; }
        .msg.user { background: #ff9f43; color: #0f172a; align-self: flex-end; }

        /* ✅ ان پٹ زون */
        .input-zone { background: #0f172a; padding: 6px 8px; display: flex; align-items: center; gap: 6px; border-top: 1px solid #1e293b; flex-shrink: 0; }
        .send-btn { background: linear-gradient(135deg, #ff9f43, #f59e0b); color: #0f172a; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #chat-input { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 18px; padding: 6px 10px; color: white; font-size: 0.85rem; outline: none; }
        .attach-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; width: 36px; height: 36px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #fileInput { display: none; }    </style>
</head>
<body>
    <div class="header">
        <div class="title">GMD SPARK</div>
        <div class="dev-info">MATEEN SUMDANI • 03007956507</div>
        <a href="https://github.com/MateenSumdani/gmd-spark" target="_blank" class="repo-link">🐙 GitHub Repository</a>
        <div class="status-bar">
            <div class="status-item"><span class="status-label">سرور</span><span class="status-value" id="srv">چیک...</span></div>
            <div class="status-item"><span class="status-label">ڈیٹا</span><span class="status-value" id="data">چیک...</span></div>
        </div>
        <!-- 🔑 ULTRA KEY & 📜 AUDIT LOG (براہ راست یہیں ایمبیڈ) -->
        <div class="key-bar">
            <span>🔑 KEY: <span class="key-val" id="ultra-key">لوڈ...</span></span>
            <span>📜 AUDIT: <span class="audit-val" id="audit-log">لوڈ...</span></span>
        </div>
    </div>

    <div class="chat-area" id="chatBox">
        <div class="msg bot">السلام علیکم! میں آپ کی کیا مدد کر سکتا ہوں؟</div>
    </div>

    <div class="input-zone">
        <!-- دائیں طرف: بھیجیں -->
        <button class="send-btn" onclick="sendMsg()">➤</button>
        <!-- درمیان: ان پٹ -->
        <input type="text" id="chat-input" placeholder="پیغام لکھیں..." onkeypress="if(event.key==='Enter') sendMsg()">
        <!-- بائیں طرف: اٹیچ -->
        <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="file" id="fileInput" onchange="handleFile(this)">
    </div>

    <script>
        // ==========================================
        // 🔐 سیکیورٹی کنفیگ (آپ کا دیا ہوا ڈیٹا)
        // ==========================================
        const GMD_SECURITY = {
            ultraKey: "GMD_ULTRA_310f1c31e862d9b0_91c5c58c37b9e91a_58984a5aa2778e26_063D3915779B_SECURE",
            auditLog: "[2026-05-19T14:35:07.621Z] ULTRA_KEY_GENERATED - 93% 494b"
        };

        // ڈیٹا بیس (فرنٹ اینڈ میں محفوظ)
        const KNOWLEDGE = [
            { q: ["سلام", "السلام", "ہیلو"], a: "وعلیکم السلام! جی حکم کریں۔" },
            { q: ["کیا ہے", "پروجیکٹ", "ایپ"], a: "یہ GMD SPARK ہے۔ ایک محفوظ چیٹ اور فائل سسٹم۔" },
            { q: ["مدد", "ہیلپ", "رہنمائی"], a: "جی میں حاضر ہوں۔ اپنا سوال پوچھیں۔" },
            { q: ["فائل", "اپلوڈ", "اٹیچ"], a: "کلپ آئیکن 📎 سے فائل منسلک کریں۔" }
        ];

        // ڈوم ایلیمنٹس        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chat-input');
        const srvEl = document.getElementById('srv');
        const dataEl = document.getElementById('data');
        const keyEl = document.getElementById('ultra-key');
        const auditEl = document.getElementById('audit-log');

        // ==========================================
        // 🚀 شروع میں لوڈ ہونے والے فنکشنز
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            // 1. KEY & AUDIT سیٹ کریں
            keyEl.textContent = GMD_SECURITY.ultraKey.slice(0, 22) + '...';
            auditEl.textContent = GMD_SECURITY.auditLog.split(']')[1].trim();

            // 2. سرور اسٹیٹس چیک (فرنٹ اینڈ سمولیشن)
            srvEl.textContent = 'ON'; srvEl.className = 'status-value';
            dataEl.textContent = `${KNOWLEDGE.length} ماڈیول`; dataEl.className = 'status-value';
        });

        // ==========================================
        // 💬 چیٹ API لاجک (براہ راست یہیں)
        // ==========================================
        async function sendMsg() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMsg(text, 'user');
            chatInput.value = '';

            // API کال (فرنٹ اینڈ میں ہی پروسیس)
            setTimeout(() => {
                const reply = getBotReply(text);
                addMsg(reply, 'bot');
            }, 300);
        }

        function getBotReply(input) {
            const lower = input.toLowerCase();
            for (const item of KNOWLEDGE) {
                if (item.q.some(keyword => lower.includes(keyword))) {
                    return item.a;
                }
            }
            return `آپ کا پیغام موصول ہوا: "${input}"۔ میں پروسیس کر رہا ہوں۔`;
        }

        // ==========================================
        // 📎 فائل ہینڈلنگ
        // ==========================================        function handleFile(input) {
            const file = input.files[0];
            if (!file) return;
            addMsg(`📎 ${file.name} (${(file.size/1024).toFixed(1)} KB)`, 'user');
            setTimeout(() => addMsg('✅ فائل سیکیورلی انکرپٹ ہو گئی۔', 'bot'), 400);
            input.value = '';
        }

        // ==========================================
        // 📝 میسج ایڈ کرنے کا فنکشن
        // ==========================================
        function addMsg(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
