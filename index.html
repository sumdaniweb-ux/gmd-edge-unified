<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GMD SPARK - AI Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0a3622;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:4px}
.dashboard{width:100%;max-width:420px;background:#0D1F1C;border-radius:36px;padding:4px 6px;border:1px solid #3b7a64;display:flex;flex-direction:column;height:98vh;box-shadow:0 30px 50px rgba(0,0,0,0.7),0 0 0 2px #2a5a4a inset}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;padding:0 4px;flex-shrink:0; position: relative;}
.title h1{color:#fff;font-size:1.1rem;font-weight:700}
.title .sub{color:#A0D4B8;font-size:0.6rem;margin-top:1px}

/* ماڈل سلیکٹر اسٹائل */
.modelSelector{position:absolute;left:0;top:5px;z-index:100}
select{background:#1F3E35;color:#FFE484;border:1px solid #3E7B66;border-radius:8px;padding:4px 8px;font-size:0.7rem;font-family:'Segoe UI',sans-serif; cursor: pointer;}
.modelIndicator{position:absolute;right:80px;top:8px;font-size:0.65rem;color:#3FE88A; font-weight: bold;}

.icons{display:flex;gap:3px}
.ico{width:28px;height:28px;border-radius:18px;background:#1F3E35;border:1px solid #3E7B66;color:#FFE484;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.85rem}
.meters{background:#162E28;border-radius:12px;padding:4px 6px;margin-bottom:3px;border:1px solid #2F5E52;display:flex;gap:4px;flex-shrink:0}
.meter{flex:1;background:#0D1F1C;border-radius:8px;padding:4px 6px;text-align:center;border:1px solid #3E7B66}
.meter-label{color:#9CBFAE;font-size:0.55rem;display:block;margin-bottom:2px}
.meter-value{color:#FFE484;font-size:0.7rem;font-weight:700;font-family:'Courier New',monospace}
.status-on{color:#3FE88A}
.status-off{color:#ff4444}
.status-loading{color:#ffaa00}
.progress-mini{height:4px;background:#1F3E35;border-radius:2px;margin-top:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3FE88A,#2ecc71);transition:width 0.5s}
.chat{background:#132A23;border-radius:16px;padding:4px 6px 4px;border:1px solid #2F6652;display:flex;flex-direction:column;min-height:0;overflow:hidden;flex:1}
.chat-head{display:flex;align-items:center;gap:3px;color:#E0F2DA;padding-bottom:3px;border-bottom:1px solid #2B5F4C;margin-bottom:3px;flex-shrink:0}
.dot{width:5px;height:5px;background:#3FE88A;border-radius:50%;box-shadow:0 0 3px #2ecc71}
.chat-head span{font-weight:600;font-size:0.75rem}
.messages{flex:1;overflow-y:auto;padding-right:2px;display:flex;flex-direction:column;gap:5px;margin-bottom:5px}
.msg{display:flex;flex-direction:column;max-width:90%}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end}
.bubble{padding:8px 10px;border-radius:14px;font-size:0.8rem;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.bot .bubble{background:#1F4A3A;color:#EAF6EE;border-bottom-left-radius:3px;border:1px solid #387A60}
.user .bubble{background:#1B4D5E;color:#fff;border-bottom-right-radius:3px;border:1px solid #338299}
.time{font-size:0.5rem;color:#89B7A2;margin-top:1px;margin-left:4px}
.user .time{text-align:right;margin-left:0;margin-right:4px}
.input-area{display:flex;gap:3px;background:#1E4036;border-radius:24px;padding:3px 3px 3px 10px;border:1px solid #3C7A64;flex-shrink:0;flex-direction:row-reverse}
.input-area input{flex:1;background:transparent;border:none;color:#fff;font-size:0.75rem;outline:none;padding:3px 0;text-align:right}
.input-area input::placeholder{color:#9CBFAE;text-align:right}
.send{background:#0D5C3E;border:none;color:#FFDF7E;font-weight:700;font-size:0.9rem;padding:3px 12px;border-radius:24px;cursor:pointer}
.send:active{background:#0a4a30}
.footer{margin-top:2px;color:#7FAA97;font-size:0.55rem;text-align:center;border-top:1px dashed #2B5F4C;padding-top:2px;flex-shrink:0}
.footer span{color:#FFE484;font-weight:600}.status-text{font-size:0.45rem;color:#7CA394;margin-top:1px}</style>
</head>
<body>
<div class="dashboard">
  <div class="header">
    <!-- ✅ ماڈل سلیکٹر (بائیں طرف) -->
    <div class="modelSelector">
      <select id="modelSelect" onchange="changeModel()">
        <option value="gmdspark" selected>🌟 GMD SPARK AI</option>
        <option value="qwen">🔹 Qwen Coder</option>
        <option value="deepseek">⚡ DeepSeek Coder</option>
        <!-- ✅ Phind ہٹا کر CodeLlama لگا دیا گیا -->
        <option value="codellama">🦙 CodeLlama-7B</option>
      </select>
    </div>
    
    <!-- ✅ ماڈل انڈیکیٹر (دائیں طرف) -->
    <div class="modelIndicator" id="modelIndicator">ماڈل: GMD SPARK AI</div>
    
    <div class="title">
        <h1>GMD SPARK</h1>
        <div class="sub">محفوظ اپلوڈ • اسمارٹ اسسٹنٹ</div>
    </div>
    <div class="icons">
      <div class="ico" onclick="doAction('copy')">📋</div>
      <div class="ico" onclick="doAction('share')">📤</div>
      <div class="ico" onclick="doAction('like')">❤️</div>
    </div>
  </div>
  
  <!-- ✅ میٹرز -->
  <div class="meters">
    <div class="meter">
      <span class="meter-label">سرور</span>
      <span class="meter-value status-loading" id="serverStatus">---</span>
      <div class="progress-mini"><div class="progress-fill" id="serverProgress" style="width:0%"></div></div>
      <span class="status-text" id="serverDetail">جاری...</span>
    </div>
    <div class="meter">
      <span class="meter-label">API</span>
      <span class="meter-value status-loading" id="apiStatus">---</span>
      <div class="progress-mini"><div class="progress-fill" id="apiProgress" style="width:0%"></div></div>
      <span class="status-text" id="apiDetail">جاری...</span>
    </div>
    <div class="meter">
      <span class="meter-label">ریسپانس ٹائم</span>
      <span class="meter-value" id="responseTime">-- ms</span>
      <div class="progress-mini"><div class="progress-fill" id="responseProgress" style="width:0%"></div></div>
    </div>
  </div>    <div class="chat">
    <div class="chat-head">
        <span class="dot"></span>
        <!-- یہاں ہمیشہ GMD SPARK لکھا آئے گا -->
        <span id="assistantName">اسسٹنٹ (GMD SPARK AI)</span>
    </div>
    <div class="messages" id="messages">
      <div class="msg bot">
        <div class="bubble">السلام علیکم! میں GMD SPARK ایجنٹ ہوں۔ کیسے مدد کر سکتا ہوں؟</div>
        <div class="time">ابھی</div>
      </div>
    </div>
    <div class="input-area">
      <input type="text" id="chatInput" placeholder="پیغام لکھیں..." autocomplete="off">
      <button class="send" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
  
  <div class="footer">
    <span>DEVELOPER BY MATEEN SUMDANI +923007956507</span>
  </div>
</div>
<script>
// ✅ نئی API Key (صرف یہی لائن اپڈیٹ کی گئی)
const GMD_ULTRA_KEY = "gmd_f40ee7fd304205e4b9779f9475a40e967a2f40029d18331f697320033566800e";
let dataRead = 0;
let currentModel = "gmdspark";

const messages = document.getElementById('messages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

// ✅ ماڈل تبدیل کرنے کا فنکشن (صرف codellama والا کیس ایڈ کیا گیا)
function changeModel() {
    const select = document.getElementById('modelSelect');
    const indicator = document.getElementById('modelIndicator');
    currentModel = select.value;
    
    if(currentModel === 'gmdspark') {
        indicator.textContent = "ماڈل: GMD SPARK AI";
        indicator.style.color = "#FFFFFF";
    } else if(currentModel === 'qwen') {
        indicator.textContent = "ماڈل: Qwen Coder";
        indicator.style.color = "#3FE88A";
    } else if(currentModel === 'deepseek') {
        indicator.textContent = "ماڈل: DeepSeek Coder";
        indicator.style.color = "#FFE484";
    } else if(currentModel === 'codellama') {  // ✅ نیا کیس
        indicator.textContent = "ماڈل: CodeLlama-7B";
        indicator.style.color = "#A0D4B8";    }
}

// ✅ سرور کا حقیقی چیک
async function checkServer() {
    const el = document.getElementById('serverStatus');
    const detail = document.getElementById('serverDetail');
    const bar = document.getElementById('serverProgress');
    el.textContent = 'جاری...';
    el.className = 'meter-value status-loading';
    detail.textContent = 'آزمائش ہو رہی ہے...';
    
    const start = Date.now();
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        
        const response = await fetch(window.location.href, { 
            method: 'HEAD', 
            mode: 'cors', 
            cache: 'no-store',
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        
        const duration = Date.now() - start;
        const isOnline = response.ok || (response.status >= 200 && response.status < 300);
        
        if(isOnline) {
            el.textContent = 'ONLINE';
            el.className = 'meter-value status-on';
            bar.style.width = '100%';
            detail.textContent = `${duration}ms ✓`;
        } else {
            el.textContent = 'OFFLINE';
            el.className = 'meter-value status-off';
            bar.style.width = '0%';
            detail.textContent = `Code: ${response.status}`;
        }
    } catch (e) {
        el.textContent = 'OFFLINE';
        el.className = 'meter-value status-off';
        bar.style.width = '0%';
        detail.textContent = `Timeout`;
    }
}

// ✅ API کا حقیقی چیک
async function checkAPI() {
    const el = document.getElementById('apiStatus');    const detail = document.getElementById('apiDetail');
    const bar = document.getElementById('apiProgress');
    el.textContent = 'جاری...';
    el.className = 'meter-value status-loading';
    detail.textContent = 'آزمائش ہو رہی ہے...';
    
    const start = Date.now();
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        
        const response = await fetch('/.netlify/functions/chat', { 
            method: 'POST', 
            headers: { 
                'Content-Type': 'application/json',
                'X-GMD-Key': GMD_ULTRA_KEY 
            },
            body: JSON.stringify({ message: "_", modelType: currentModel }),
            mode: 'cors',
            cache: 'no-store',
            signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        const duration = Date.now() - start;
        
        document.getElementById('responseTime').textContent = `${duration}ms`;
        const progress = Math.min((duration / 2000) * 100, 100);
        document.getElementById('responseProgress').style.width = `${100-progress}%`;
        document.getElementById('responseProgress').style.background = 
            duration < 1000 ? '#3FE88A' : duration < 2000 ? '#ffaa00' : '#ff4444';
        
        if(response.ok) {
            el.textContent = 'ACTIVE';
            el.className = 'meter-value status-on';
            bar.style.width = '100%';
            detail.textContent = `Success (${duration}ms)`;
        } else {
            el.textContent = 'ERROR';
            el.className = 'meter-value status-off';
            bar.style.width = '0%';
            detail.textContent = `HTTP ${response.status}`;
        }
    } catch (e) {
        el.textContent = 'ERROR';
        el.className = 'meter-value status-off';
        bar.style.width = '0%';
        detail.textContent = `Error`;
    }
}
function updateDataProgress() {
    const percent = Math.min((dataRead / 100) * 100, 100);
    document.getElementById('dataPercent').textContent = Math.round(percent) + '%';
    document.getElementById('dataProgress').style.width = percent + '%';
}

function addMessage(text, isUser) {
    const div = document.createElement('div');
    div.className = `msg ${isUser ? 'user' : 'bot'}`;
    
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    
    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString('ur-PK', { hour: '2-digit', minute: '2-digit' });
    
    div.appendChild(bubble);
    div.appendChild(time);
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    
    if (!isUser) {
        dataRead += 5;
        updateDataProgress();
    }
}

async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    
    addMessage(text, true);
    chatInput.value = '';
    
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'msg bot';
    loadingDiv.id = 'loadingMsg';
    loadingDiv.innerHTML = '<div class="bubble">... سوچ رہا ہوں</div>';
    messages.appendChild(loadingDiv);
    messages.scrollTop = messages.scrollHeight;
    
    sendBtn.disabled = true;
    sendBtn.textContent = '⏳';
    
    try {
        const response = await fetch('/.netlify/functions/chat', {
            method: 'POST',            headers: {
                'Content-Type': 'application/json',                
                'X-GMD-Key': GMD_ULTRA_KEY
            },
            body: JSON.stringify({ message: text, modelType: currentModel })
        });
        
        const loading = document.getElementById('loadingMsg');
        if (loading) loading.remove();
        
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const result = await response.json();
        addMessage(result.reply || "جواب نہیں ملا", false);
        
    } catch (error) {
        const loading = document.getElementById('loadingMsg');
        if (loading) loading.remove();
        
        let errorMsg = '❌ ';
        if (error.message.includes('Failed to fetch')) errorMsg += 'سرور سے رابطہ نہیں ہوا۔';
        else if (error.message.includes('503')) errorMsg += 'AI ماڈل لوڈ ہو رہا ہے۔ 20 سیکنڈ بعد دوبارہ بھیجیں۔';
        else if (error.message.includes('401')) errorMsg += 'Token غلط ہے۔';
        else errorMsg += error.message;
        
        addMessage(errorMsg, false);
    } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = '➤';
    }
}

chatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
});

function doAction(type) {
    if (type === 'like') alert('❤️');
    else if (type === 'share') {
        if (navigator.share) navigator.share({ title: 'GMD SPARK', url: window.location.href });
        else { navigator.clipboard.writeText(window.location.href); alert('📋 لنک کاپی!'); }
    } else if (type === 'copy') {
        navigator.clipboard.writeText('GMD SPARK');
        alert('📋 کاپی!');
    }
}

window.onload = function() {
    chatInput.focus();
    checkServer();    checkAPI();
};
</script>
</body>
</html>
