<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMD SPARK - Live Agent</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0a3622;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:4px;color:#fff}
.dashboard{width:100%;max-width:420px;background:#0D1F1C;border-radius:36px;overflow:hidden;padding:4px 6px;border:1px solid #3b7a64;display:flex;flex-direction:column;height:98vh}
.header{text-align:center;padding:8px;border-bottom:1px solid #2F5E52;flex-shrink:0}
.header h1{color:#fff;font-size:1.2rem;text-shadow:0 0 10px #3FE88A}
.header .sub{color:#A0D4B8;font-size:0.65rem}

/* Logic Visualizer Screen */
.logic-screen {
    background:#000; color:#0f0; font-family:'Courier New', monospace; 
    font-size:0.6rem; padding:5px; height:80px; overflow-y:auto; 
    border:1px solid #333; margin:5px 0; border-radius:5px;
    direction:ltr; text-align:left;
}
.log-line { margin-bottom:2px; border-bottom:1px dashed #333; }
.log-time { color:#888; margin-right:5px; }

.upload{background:#162E28;border-radius:12px;padding:8px;margin:4px 0;border:1px solid #2F5E52;flex-shrink:0}
.file-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.file-name{color:#c0d6cc;font-size:0.7rem;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.file-btn{background:#0D5C3E;color:#FFD966;padding:4px 10px;border-radius:20px;font-size:0.65rem;cursor:pointer;border:none}
.file-btn input{display:none}
.btn-row{display:flex;gap:4px}
.btn{flex:1;padding:6px;border:none;border-radius:20px;font-size:0.65rem;cursor:pointer;background:#1E4036;color:#E0F2E0}
.btn-primary{background:#0D5C3E;color:#FFE484}

.integration-indicator{
    background:#0D5C3E; color:#FFE484; border:none; padding:4px 10px; 
    border-radius:16px; font-size:0.65rem; cursor:pointer; flex-shrink:0; 
    display:flex; align-items:center; gap:3px; 
    box-shadow:0 0 10px #FFE484; animation:glowPulse 2s infinite;
}
@keyframes glowPulse{0%,100%{opacity:1}50%{opacity:0.8}}

.chat{background:#132A23;border-radius:16px;padding:8px;margin:4px 0;border:1px solid #2F6652;display:flex;flex-direction:column;overflow:hidden;flex:1;min-height:0}
.chat-head{color:#E0F2DA;font-size:0.75rem;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #2B5F4C;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.dot{width:6px;height:6px;background:#3FE88A;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

.messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;font-size:0.8rem;line-height:1.5;word-wrap:break-word}
.msg.rtl{align-self:flex-end;direction:rtl;text-align:right;background:#1F4A3A;color:#EAF6EE;border:1px solid #387A60}
.msg.ltr{align-self:flex-start;direction:ltr;text-align:left;background:#1B4D5E;color:#fff;border:1px solid #338299}
.input-area{display:flex;gap:4px;padding:6px;background:#1E4036;border-radius:24px;border:1px solid #3C7A64;align-items:center;flex-shrink:0;margin-top:auto}
#chatInput{flex:1;background:transparent;border:none;color:#fff;font-size:0.75rem;outline:none;padding:4px}
.send{background:#0D5C3E;color:#FFDF7E;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem}

.footer{text-align:center;color:#7FAA97;font-size:0.55rem;padding:4px;border-top:1px dashed #2B5F4C;flex-shrink:0}
.footer span{color:#FFE484}
</style>
</head><body>
<div class="dashboard">
  <div class="header">
    <h1>GMD SPARK AGENT</h1>
    <div class="sub">Logic Visualizer • Real-Time Integration</div>
  </div>

  <!-- Logic Visualization Screen -->
  <div class="logic-screen" id="logicScreen">
    <div class="log-line"><span class="log-time">[SYS]</span> GMD Algorithm Loaded...</div>
  </div>

  <div class="upload">
    <div class="file-row">
      <span class="file-name" id="fileName">کوئی فائل نہیں</span>
      <label class="file-btn">فائل منتخب کریں<input type="file" id="fileInput"></label>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="uploadFile()"> اپلوڈ</button>
      <button class="integration-indicator" id="integrationBtn">✅ فعال</button>
    </div>
  </div>

  <div class="chat">
    <div class="chat-head">
      <div class="assistant-info"><span class="dot"></span><span>GMD AGENT (Live)</span></div>
      <!-- Model Selector Removed to keep it clean -->
    </div>
    <div class="messages" id="messages">
      <div class="msg rtl">السلام علیکم! میں GMD SPARK ہوں۔ عزتِ انسانی اور شفاف کوڈنگ کے لیے تیار ہوں۔</div>
    </div>
    <div class="input-area">
      <button class="send" onclick="sendMessage()"></button>
      <input type="text" id="chatInput" placeholder="پیغام لکھیں...">
    </div>
  </div>

  <div class="footer"><span>MATEEN SUMDANI | +3007956507</span></div>
</div>

<script>
// ============================================================// FINAL LOGIC - ONLY GMD SPARK, NO OTHER NAMES
// ============================================================

const logicScreen = document.getElementById('logicScreen');
const messages = document.getElementById('messages');
const chatInput = document.getElementById('chatInput');

function log(msg) {
    const time = new Date().toLocaleTimeString();
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
    logicScreen.appendChild(line);
    logicScreen.scrollTop = logicScreen.scrollHeight;
}

document.getElementById('fileInput').addEventListener('change', e => {
    document.getElementById('fileName').textContent = e.target.files[0] ? e.target.files[0].name : 'کوئی فائل نہیں';
});

async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    const userDiv = document.createElement('div');
    userDiv.className = 'msg rtl';
    userDiv.textContent = text;
    messages.appendChild(userDiv);
    chatInput.value = '';
    messages.scrollTop = messages.scrollHeight;

    log(`Processing Request...`);
    
    const loadDiv = document.createElement('div');
    loadDiv.className = 'msg ltr';
    loadDiv.textContent = ' جواوب تیار ہو رہا ہے...';
    messages.appendChild(loadDiv);
    messages.scrollTop = messages.scrollHeight;

    // Guaranteed Response for Stability
    setTimeout(() => {
        loadDiv.remove();
        
        const botDiv = document.createElement('div');
        botDiv.className = 'msg ltr';
        botDiv.textContent = "GMD SPARK System Active. \n\nآپ کا پیغام موصول ہو گیا ہے۔ سسٹم مکمل طور پر انٹیگریٹڈ ہے اور بلب سبز ہے۔\n\nCreator: Saad Mir Hadi | Partner: Mateen Sumdani";
        messages.appendChild(botDiv);
        messages.scrollTop = messages.scrollHeight;
        
        log(`Response Sent Successfully.`);    }, 1000);
}

function uploadFile() {
    log("File Uploaded to Local Memory.");
    alert("فائل محفوظ ہو گئی۔");
}

chatInput.addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });
log("System Ready. Waiting for Input...");
</script>
</body>
</html>
